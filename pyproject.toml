[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "geopub"
dynamic = ["version"]
description = "Batch publish PostGIS tables as GeoServer layers, bind SLD styles, and audit publish status."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "geopub contributors" }]
keywords = ["geoserver", "postgis", "gis", "sld", "cli", "publish"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: GIS",
]

dependencies = [
    "typer>=0.12",
    "httpx>=0.27",
    "openpyxl>=3.1",
    "questionary>=2.0",
    "psycopg2-binary>=2.9",
    "rich>=13.0",
]

[project.optional-dependencies]
web = ["fastapi>=0.110", "uvicorn>=0.29"]
build = ["pyinstaller>=6.0"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.5"]

[project.scripts]
geopub = "geopub.cli:app"

[project.urls]
Homepage = "https://github.com/yeahQing/geoserver-pub-cli"
Issues = "https://github.com/yeahQing/geoserver-pub-cli/issues"
Changelog = "https://github.com/yeahQing/geoserver-pub-cli/blob/main/CHANGELOG.md"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
geopub = ["web/static/*"]

[tool.setuptools.dynamic]
version = { attr = "geopub.__version__" }

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
