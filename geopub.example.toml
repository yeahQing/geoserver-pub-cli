# geopub 配置文件示例
#
# 使用方式：复制为 geopub.toml（或 .geopub.toml）
#   1) 放到**当前工作目录**——工具启动时自动加载；
#   2) 或放到**用户主目录**（~/.geopub.toml）——所有目录通用，推荐用于个人常用环境；
#   3) 或显式指定：geopub --config /path/to/geopub.toml <subcommand>
#
# 优先级：命令行显式参数 > 配置文件 > 内置默认值。
# 也支持 .json / .yaml 格式（yaml 需 pip install pyyaml）。
#
# 安全提示：本文件含明文密码，请勿提交到版本库（仓库 .gitignore 已忽略 geopub.toml），
# 并妥善设置文件权限（Linux/macOS: chmod 600 geopub.toml）。

[geoserver]
url = "http://localhost:8080/geoserver"   # GeoServer 地址，必须带 /geoserver 后缀；HTTP/HTTPS 均可
user = "admin"                             # GeoServer 登录用户名（REST 发布/绑定需管理员权限）
password = "YOUR_PASSWORD"                 # GeoServer 登录密码（也可命令行 --password 传入）
workspace = "demo"                         # 工作空间名：图层与样式都会发布到该 workspace 下

[database]
host = "localhost"                         # PostGIS 数据库主机 IP 或域名（图层数据的来源库）
port = 5432                                # 数据库端口，PostgreSQL 默认 5432
dbname = "gis"                             # 数据库名（含待发布图层的那个库）
schema = "public"                          # schema 名：待发布表所在的模式，默认 public
user = "postgres"                          # 数据库用户名（需有该 schema 的读权限）
password = "YOUR_PASSWORD"                 # 数据库登录密码（也可命令行 --db-pass 传入）
store = "pg_store"                         # GeoServer 数据存储(store)名称：不存在会自动创建；同一库建议固定一个 store 名

# ---- 以下为各子命令的默认值（均可被命令行覆盖）----

[layer]
file_path = ""      # 图层名清单文件路径（.xlsx 或 .csv）
column = "图层名"    # 文件中图层名列标题
all = false         # 是否发布 schema 下所有表

[style]
dir = ""            # SLD 文件目录
file_path = ""      # 样式-图层映射文件（可选，.xlsx 或 .csv）

[fetch]
out = "sld_output"  # SLD 输出目录：拉取的每个 .sld 落盘到此目录
file_path = ""      # 图层名清单文件路径（.xlsx 或 .csv，按 column 列读取）
column = "图层名"    # 文件中图层名列标题

[check]
out = "layer_check_result.csv"  # 结果 CSV 输出路径（核对已发布/未发布）
file_path = ""      # 图层名清单文件路径（.xlsx 或 .csv，按 column 列读取）
column = "图层名"    # 文件中图层名列标题
deep = false        # 识别「FeatureType 在、Layer 缺」的中间态（重跑 layer 可自愈）
check_db = false    # 追加「数据库表」列：区分「库里有表没发布」与「库里没表」（需 database 段）
only_missing = false # 结果 CSV 只输出未发布的图层（可直接当 geopub layer 的输入清单）
with_store = true   # 输出「数据存储」列：批量查 FeatureType（1+store 数 次请求）
with_style = false  # 输出「默认样式」列：需逐图层查详情，较慢，默认关闭
